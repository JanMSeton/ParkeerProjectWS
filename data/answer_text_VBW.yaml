dynamic_responses:
  "Q14": #getal. Vraag 2
    "default": |

      -----------------------------
      
      Jij vindt ongeveer {answer} keer per dag iets gek.
      Als je op reis bent, zal dit waarschijnlijk veel vaker zijn. Op reis ver van huis ervaar je vaak eerst een cultuurshock, een soort culturele disorientatie. Daarna kan je cultuurstress ervaren. Dat is een langer proces wat van je verwacht dat je je aanpast, dit kan erg vermoeiend zijn. Oefen thuis door eens andere keuzes dan normaal te maken. Bijvoorbeeld naar een andere supermarkt of een andere route fietsen. Kost het meer energie? Misschien. Maar, ben je meer in het moment? Hopelijk wel! Neem dit mee als je nieuwe dingen ervaart en tegenkomt tijdens je project.


  "Q15": #getal. Vraag 3
    "default": |

      -----------------------------
      
      Jij fronst ongeveer {answer} keer per dag met je wenkbrauwen. Let de rest van de dag eens op hoe vaak je (onbewust of bewust) fronst. Is het meer dan je verwacht?

      Opdracht: Frons een paar keer met je wenkbrauwen. Voor extra effect: kijk in de spiegel of naar iemand anders als je fronst. 
      Hoe voelt dat? Wat ervaar je en wat doet het met je?
      
      Je wenkbrauwen fronsen wanneer je iets gek vindt of er gebeurt iets wat je niet gewend bent. Met het fronsen trek je ook snel een oordeel. 

      Probeer situaties niet te begrijpen met de kennis die je hebt. Die kennis past namelijk bij je eigen cultuur en gewoontes. Probeer daarom de kennis te vinden die past bij de situatie en mensen. Dat doe je door open vragen te stellen: hoe, waarom, waardoor?

      Wanneer je je wenkbrauwen voelt fronsen, wees dan nieuwsgierig en stel open vragen!
      
