pages:
  - text: 'Welkom bij de World Servants Parkeerautomaat.<br><br>Druk op Enter om te starten.'

  - text: 'Wat is je naam? <br>Typ je naam en druk op enter.'
    input: 'Mijn naam is ${myName}'
    property: 'enterName'

  - text: 'Hallo ${myName},<br>Beantwoord de volgende vragen zodat jouw Bon van Betekenis opgesteld kan worden. <br><br>Alvast bedankt voor het vertrouwen om je cultuur hier te parkeren.<br><br> Druk op enter.'

  - text: 'Hierna volgen 3 stellingen. Geef aan of de stelling herkenbaar is voor jouw leven.<br><br>Er zijn geen goede of foute antwoorden. Laten we beginnen!<br><br>Druk op enter.'
    random: [5, 6, 7, 8, 9, 10]
    next: 12

  - text: 'Stelling:<br>“Mijn gezin bestaat uit een vader, moeder, en misschien broer(s) en zus(sen).”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar.<br><br>Druk op 1, 2 of 3 en op enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>"Privacy of een momentje voor mezelf? Nee, ik ben altijd met andere mensen.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>“Ik vind het belangrijk dat mensen op tijd komen. Als je te laat komt, stuur je een berichtje.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>“Als iemand op bezoek komt, doet hij gewoon mee met wat ik aan het doen ben. Bijvoorbeeld grasmaaien of koken.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>“Ik voel me altijd vrij om aan te sluiten wanneer mensen alleen of met twee zijn.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>“Mijn opa, oma, neefjes, nichtjes, ooms en/of tantes wonen bij ons thuis.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Stelling:<br>“Ik wil niet tot last zijn als ik op bezoek ga. Ik sla de koffie of thee af als niemand neemt.”<br><br>1 = niet herkenbaar, 2 = neutraal, 3 = heel herkenbaar. <br><br> Druk op 1, 2 of 3 en enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'oneTwoThreeInput'

  - text: 'Dat waren de stellingen. Hierna volgen 2 vragen. Onthoud: er zijn geen goede of foute antwoorden.<br><br> Druk op enter.'
    random: [13, 14, 15]
    next: 16

  - text: 'Vraag:<br>Welke smiley beschrijft de schaduwkant van het leven voor jou? <br>A= :)<br>B= :|<br>C= :( <br><br> Druk op A, B, of C en druk op enter.'
    input: 'Jouw antwoord: ${currentInput}'
    property: 'abcInput'

  - text: 'Vraag:<br>Hoe vaak per dag vind jij iets gek of gaat iets anders dan je gewend bent?<br><br>Voer een getal in en druk op enter.'
    input: 'Jouw antwoord: ${currentInput} keer per dag.'
    property: 'zeroNineInput'

  - text: 'Vraag:<br>Hoe vaak per dag frons jij je wenkbrauwen? <br><br> Voer een getal in en druk op enter.'
    input: 'Jouw antwoord: ${currentInput} keer per dag.'
    property: 'zeroNineInput'

  - text: 'Dank je wel voor het parkeren van je cultuur. Vergeet je bon niet! <br><br> Druk op P om te printen.'
    next: 1